<!DOCTYPE html>
<html>
<head>
	<!-- Add CSS at the head of HTML file -->
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>

	<!-- Your code goes here-->

	<!-- Simulation Main Screen -->
	<div id="simulationMain" class="simulation-container">
		<div class="simulation-content">
			<h1 class="main-title">Swaging Process</h1>
			<p class="subtitle">Select a view to begin the simulation</p>

			<div class="button-container">
				<button class="sim-button" onclick="showVideo('process')">
					<div class="button-icon">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
							stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<polygon points="5 3 19 12 5 21 5 3"></polygon>
						</svg>
					</div>
					<span class="button-text">Process</span>
				</button>

				<button class="sim-button" onclick="showVideo('result')">
					<div class="button-icon">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
							stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
						</svg>
					</div>
					<span class="button-text">Result</span>
				</button>
			</div>
		</div>
	</div>

	<!-- Video Player Screen -->
	<div id="videoPlayer" class="video-container hidden">
		<div class="video-content">
			<button class="back-button" onclick="backToMain()">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
					stroke="currentColor" stroke-width="2"
					stroke-linecap="round" stroke-linejoin="round">
					<line x1="19" y1="12" x2="5" y2="12"></line>
					<polyline points="12 19 5 12 12 5"></polyline>
				</svg>
				Back to Simulation
			</button>

			<h2 id="videoTitle" class="video-title"></h2>

			<div class="video-wrapper">
				<video id="simulationVideo" controls autoplay loop>
					<source id="videoSource" src="" type="video/mp4">
					Your browser does not support the video tag.
				</video>
			</div>
		</div>
	</div>

	<!-- Add JS at the bottom of HTML file --> 
    <script src="./js/main.js"></script>

</body>
</html>
