<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swaging Process Simulation</title>
    <!-- Add CSS at the head of HTML file -->
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <!-- Experiment Selection Screen -->
    <div id="experimentSelection" class="selection-container">
        <div class="selection-content">
            <h1 class="main-title">Select Experiment</h1>
            <p class="subtitle">Choose an experiment to begin the simulation</p>
            
            <div class="experiment-cards">
                <div class="experiment-card" onclick="showExperiment('kinematics')">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <h2 class="card-title">Swaging Kinematics</h2>
                    <p class="card-description">Explore the motion and dynamics of the swaging process</p>
                    <div class="card-button">Start Experiment →</div>
                </div>
                
                <div class="experiment-card" onclick="showExperiment('strain')">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        </svg>
                    </div>
                    <h2 class="card-title">Swaging Strain</h2>
                    <p class="card-description">Analyze stress and strain distribution during swaging</p>
                    <div class="card-button">Start Experiment →</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Player Screen -->
    <div id="videoPlayer" class="video-container hidden">
        <div class="video-content">
            <button class="back-button" onclick="backToSelection()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Experiments
            </button>
            
            <h2 id="videoTitle" class="video-title"></h2>
            
            <div class="video-wrapper">
                <video id="experimentVideo" controls autoplay loop>
                    <source id="videoSource" src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </div>

    <!-- Add JS at the bottom of HTML file --> 
    <script src="./js/main.js"></script>
</body>
</html>
